<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E-ContractApp｜簽署中心</title><style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#172033;background:#f7f9fc}main{background:#fff;border:1px solid #dce3ee;padding:30px}label{display:block;margin:16px 0;font-weight:700}input,textarea,button{font:inherit;width:100%;padding:10px;margin-top:6px;box-sizing:border-box}button{background:#1b365d;color:#fff;border:0;cursor:pointer}button.secondary{background:#e9efff;color:#172033}button.danger{background:#a33a32}.actions{display:flex;gap:12px}.actions button{flex:1}.muted{color:#64748b}.error{color:#a33a32;min-height:24px}.ok{color:#087443}
</style></head><body><main id="app"><h1>全球化合約管理系統</h1><p class="muted">Global Contract Management System · Secure signing centre</p><section id="signing" hidden><h2 id="title">載入邀請／Loading invitation</h2><p id="summary"></p><label>姓名／Name<input id="name" autocomplete="name"></label><label>原因／Reason<textarea id="reason" rows="3" placeholder="拒絕或退回修改時請說明／Required for decline or change request"></textarea></label><label><input id="consent" type="checkbox" style="width:auto"> 我同意電子簽署／I consent to electronic signing</label><div class="actions"><button id="sign">確認簽署／Sign</button><button id="changes" class="secondary">退回修改／Request changes</button><button id="decline" class="danger">拒絕／Decline</button></div><p id="result" class="error"></p></section><section id="landing"><h2>簽署邀請／Signing invitation</h2><p>請使用 Email 中的專屬連結開啟本頁。／Open this page using the private link in your invitation email.</p></section></main><script type="module" src="app.js"></script></body></html>
